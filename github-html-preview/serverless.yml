org: dohyeon5626
app: github-html-preview
service: github-html-preview

provider:
  name: aws
  runtime: nodejs22.x

functions:
  api:
    handler: app.application
    events:
      - httpApi: "*"

build:
  esbuild:
    bundle: true
    minify: false
    platform: node
    target: node22

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

package:
  exclude:
    - .env
